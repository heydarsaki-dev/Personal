name: server

on:
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "Minutes to keep the node alive (max 350)"
        required: false
        default: "350"
  schedule:
    # Every 6h: the job budget below is 335 min, so the next scheduled run
    # (360 min later) cannot cancel this one through the concurrency group.
    - cron: "0 */6 * * *"      # fresh node every 6h, replaces the dying one

# Tailnet policy required for auto-approved exit nodes (Access controls / policy.json):
#   "tagOwners":      { "tag:gh-exit": ["autogroup:admin"] },
#   "autoApprovers":  { "exitNode": ["tag:gh-exit"] },
# The auth key must also be created with the tag:gh-exit tag selected
# (plus Reusable + Ephemeral), otherwise tailscale up rejects the tag request.

concurrency:
  group: server
  cancel-in-progress: false     # never cancel a running node: a cancelled job saves no cache

permissions:
  contents: read

jobs:
  Server:
    runs-on: ubuntu-latest
    timeout-minutes: 355        # hard cap is 360
    env:
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      TS_TAILNET: ${{ secrets.TS_TAILNET || '-' }}
      TS_CLIENT_ID: ${{ secrets.TS_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TS_CLIENT_SECRET }}
      RUN_MINUTES: ${{ inputs.run_minutes || '350' }}
      NODE_NAME: gh-vpn
      EXIT_TAG: tag:gh-exit
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
      HERMES_BACKUP_TOKEN: ${{ secrets.HERMES_BACKUP_TOKEN }}
      HERMES_BACKUP_REPO: heydarsaki-dev/HermesBackup
      HERMES_MODEL: MyCombo
      NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
      HERMES_RESTART_DELAY: 10
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      OMNIROUTE_MODEL: ${{ vars.OMNIROUTE_MODEL || 'MyCombo' }}
      OMNIROUTE_VERSION: "3.8.53"
      OMNIROUTE_PORT: "20128"
      # v2ray — the DNS name clients use, published as a subdomain so the apex
      # record is left alone. The repository variable wins when it is set; the
      # literal is a fallback so an empty variable can never silently switch the
      # whole v2ray block off (which is what skips those steps).
      V2RAY_DOMAIN: ${{ vars.V2RAY_DOMAIN || 'vpn.heydarsaki.bond' }}
      V2RAY_UUID: ${{ secrets.V2RAY_UUID || '' }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN || '' }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID || '' }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || '' }}
      CF_TUNNEL_ID: ${{ secrets.CF_TUNNEL_ID || '' }}
      V2RAY_PORT: "8080"
      V2RAY_WS_PATH: "/v2ray"
      # SearXNG — self-hosted metasearch that backs Hermes' web_search tool.
      # Pinned version so the cached install and the source tree never drift.
      SEARXNG_REPO: https://github.com/searxng/searxng.git
      SEARXNG_ROOT: /home/runner/.searxng
      SEARXNG_PORT: "8888"
      SEARXNG_URL: http://127.0.0.1:8888
      # Wall-clock budget for the whole job. The Keep alive step measures the
      # remaining time from this budget (counted from the job start), so the
      # workflow always finishes before timeout-minutes and still has time for
      # the stop/backup steps. A cancelled job saves no cache.
      JOB_TIMEOUT_MINUTES: "335"
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Enable IP forwarding
        continue-on-error: true
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1
          echo 'net.ipv4.ip_forward=1'        | sudo tee -a /etc/sysctl.conf
          echo 'net.ipv6.conf.all.forwarding=1' | sudo tee -a /etc/sysctl.conf

      - name: Delete old tailnet nodes
        continue-on-error: true
        run: |
          token=$(curl -fsSL -d "client_id=$TS_CLIENT_ID" \
                          -d "client_secret=$TS_CLIENT_SECRET" \
                          -d "grant_type=client_credentials" \
                          https://api.tailscale.com/api/v2/oauth/token \
                  | jq -r '.access_token')
          curl -fsSL -H "Authorization: Bearer $token" \
            "https://api.tailscale.com/api/v2/tailnet/$TS_TAILNET/devices" \
            | jq -r --arg name "$NODE_NAME" '.devices[]? | select(.hostname == $name) | .id' \
            | while read -r id; do
                curl -fsSL -X DELETE -H "Authorization: Bearer $token" \
                  "https://api.tailscale.com/api/v2/device/$id"
                echo "removed stale node $id"
              done

      - name: Install tailscale
        continue-on-error: true
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: Cache apt index and packages
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.apt-cache
          key: apt-${{ runner.os }}-ssh-${{ github.run_id }}
          restore-keys: |
            apt-${{ runner.os }}-ssh-

      - name: Ensure SSH server is available
        continue-on-error: true
        run: |
          cache="$HOME/.apt-cache"
          mkdir -p "$cache"
          if [ -f "$cache/lists.tar" ]; then
            sudo mkdir -p /var/lib/apt/lists
            sudo tar -C /var/lib/apt/lists -xf "$cache/lists.tar" 2>/dev/null \
              && echo "restored cached apt index"
          fi
          if [ -f "$cache/archives.tar" ]; then
            sudo mkdir -p /var/cache/apt/archives/partial
            sudo tar -C /var/cache/apt/archives -xf "$cache/archives.tar" 2>/dev/null \
              && echo "restored cached .deb packages"
          fi
          install_sshd() {
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-server
          }
          if ! install_sshd; then
            echo "cached apt index unusable - running apt-get update"
            sudo apt-get update
            install_sshd
          fi
          sudo tar -C /var/lib/apt/lists -cf "$cache/lists.tar" . 2>/dev/null || true
          sudo tar -C /var/cache/apt/archives -cf "$cache/archives.tar" . 2>/dev/null || true
          cfg=$(ls /etc/ssh/sshd_config /etc/sshd_config 2>/dev/null | head -1)
          if [ -n "$cfg" ]; then
            sudo sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin prohibit-password/' "$cfg"
          fi
          sudo ssh-keygen -A
          sudo service ssh start || sudo systemctl start ssh
          sudo sshd -t

      - name: Join tailnet as exit node
        run: |
          for i in $(seq 1 30); do tailscale status >/dev/null 2>&1 && break; sleep 1; done
          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="$NODE_NAME" \
            --advertise-exit-node \
            --advertise-tags="$EXIT_TAG" \
            --accept-dns=false \
            --ssh \
            --timeout=60s
          sleep 3
          echo "NODE_IP=$(tailscale ip -4)" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- v2ray
      # Install and configure v2ray with WebSocket on localhost:8080.
      # Cloudflare Tunnel (cloudflared) forwards public 443/TLS traffic down
      # an outbound connection to localhost:8080. No inbound port needed.

      - name: Get public IP
        id: public-ip
        continue-on-error: true
        run: |
          PUB_IP=$(curl -fsS https://api.ipify.org || curl -fsS https://ifconfig.me || curl -fsS https://ipinfo.io/ip)
          echo "PUBLIC_IP=$PUB_IP" >> "$GITHUB_OUTPUT"
          echo "Runner public IP: $PUB_IP"

      - name: Update Cloudflare DNS CNAME record (tunnel target)
        if: env.V2RAY_DOMAIN != '' && env.CF_API_TOKEN != '' && env.CF_TUNNEL_ID != ''
        continue-on-error: true
        env:
          DOMAIN: ${{ env.V2RAY_DOMAIN }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_EMAIL: ${{ secrets.CF_API_EMAIL }}
          CF_ZONE: ${{ secrets.CF_ZONE_ID }}
          TUNNEL_ID: ${{ secrets.CF_TUNNEL_ID }}
        run: |
          CF_TOKEN=$(printf '%s' "$CF_TOKEN" | tr -d '\r' | tr -d '"' | tr -d "'")
          CF_TOKEN=$(printf '%s' "$CF_TOKEN" | xargs)
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning title=Cloudflare::CF_API_TOKEN is empty - DNS left alone"
            exit 0
          fi

          if printf '%s' "$CF_TOKEN" | grep -Eq '^[0-9a-f]{37}$'; then
            if [ -z "$CF_EMAIL" ]; then
              echo "::warning title=Cloudflare::Global API Key needs CF_API_EMAIL - DNS left alone"
              exit 0
            fi
            AUTH=(-H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_TOKEN")
          else
            AUTH=(-H "Authorization: Bearer $CF_TOKEN")
          fi

          ZONE_ID=""
          ZONE_CANDIDATES="$DOMAIN"
          case "$DOMAIN" in
            *.*.*) ZONE_CANDIDATES="$ZONE_CANDIDATES ${DOMAIN#*.}" ;;
          esac
          for cand in $ZONE_CANDIDATES; do
            ZONES=$(curl -sS "${AUTH[@]}" \
              "https://api.cloudflare.com/client/v4/zones?name=$cand&per_page=50")
            ZONE_ID=$(printf '%s' "$ZONES" | jq -r --arg d "$cand" \
              'if .success and (.result | length) > 0 then (.result[] | select(.name == $d) | .id) else empty end' | head -1)
            if [ -n "$ZONE_ID" ]; then
              echo "Zone $cand resolved: $ZONE_ID"
              break
            fi
          done
          if [ -z "$ZONE_ID" ]; then
            ZONE_ID=$CF_ZONE
            echo "::warning title=Cloudflare::falling back to CF_ZONE_ID"
          fi
          if [ -z "$ZONE_ID" ]; then
            echo "::warning title=Cloudflare::no zone found - DNS left alone"
            exit 0
          fi

          TARGET="${TUNNEL_ID}.cfargotunnel.com"

          for NAME in "$DOMAIN" "www.$DOMAIN"; do
            GET_BODY=$(curl -sS "${AUTH[@]}" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$NAME&per_page=50")
            CNAME_ID=$(printf '%s' "$GET_BODY" | jq -r 'if .success then (.result[] | select(.type=="CNAME") | .id) else empty end' | head -1)
            A_ID=$(printf '%s' "$GET_BODY" | jq -r 'if .success then (.result[] | select(.type=="A") | .id) else empty end' | head -1)

            if [ -n "$A_ID" ]; then
              curl -sS -X DELETE "${AUTH[@]}" \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$A_ID" \
                | jq -r '.success // empty' >/dev/null \
                && echo "deleted conflicting A record for $NAME" \
                || echo "::warning title=Cloudflare::could not delete A record for $NAME"
            fi

            if [ -n "$CNAME_ID" ]; then
              METHOD=PUT
              URL="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$CNAME_ID"
            else
              METHOD=POST
              URL="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"
            fi
            BODY=$(curl -sS -X "$METHOD" "${AUTH[@]}" \
              -H "Content-Type: application/json" "$URL" \
              -d "{\"type\":\"CNAME\",\"name\":\"$NAME\",\"content\":\"$TARGET\",\"ttl\":300,\"proxied\":true}")
            if printf '%s' "$BODY" | jq -e '.success' >/dev/null 2>&1; then
              if [ "$METHOD" = PUT ]; then
                echo "Cloudflare CNAME record updated: $NAME -> $TARGET (proxied=true)"
              else
                echo "Cloudflare CNAME record created: $NAME -> $TARGET (proxied=true)"
              fi
            else
              echo "::warning title=Cloudflare::CNAME record not updated for $NAME (HTTP body below)"
              printf '%s' "$BODY" | head -c 400
              echo
            fi
          done

      - name: Install v2ray
        if: env.V2RAY_DOMAIN != '' && env.V2RAY_UUID != ''
        continue-on-error: true
        run: |
          curl -fsSL https://github.com/v2fly/fhs-install-v2ray/raw/master/install-release.sh | sudo bash
          /usr/local/bin/v2ray version

      - name: Generate v2ray config
        if: env.V2RAY_DOMAIN != '' && env.V2RAY_UUID != ''
        continue-on-error: true
        env:
          DOMAIN: ${{ env.V2RAY_DOMAIN }}
          UUID: ${{ secrets.V2RAY_UUID }}
          PORT: ${{ env.V2RAY_PORT }}
          WS_PATH: ${{ env.V2RAY_WS_PATH }}
        run: |
          RAW="$UUID"
          UUID=$(printf '%s' "$RAW" | tr -d '\r' | tr -d '"' | tr -d "'" | tr 'A-Z' 'a-z')
          UUID=$(printf '%s' "$UUID" | xargs)
          if ! printf '%s' "$UUID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error title=v2ray::V2RAY_UUID is not a UUID"
            exit 1
          fi
          cat > /tmp/config.json <<EOF
          {
            "inbounds": [
              {
                "port": ${PORT},
                "listen": "127.0.0.1",
                "protocol": "vmess",
                "settings": {
                  "clients": [{"id": "${UUID}", "alterId": 0}]
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": {
                    "path": "${WS_PATH}",
                    "headers": {"Host": "${DOMAIN}"}
                  }
                }
              }
            ],
            "outbounds": [{"protocol": "freedom", "settings": {}}],
            "dns": {"servers": ["https+local://1.1.1.1/dns-query", "8.8.8.8", "localhost"]}
          }
          EOF
          sudo mkdir -p /usr/local/etc/v2ray
          sudo cp /tmp/config.json /usr/local/etc/v2ray/config.json
          /usr/local/bin/v2ray test -config /usr/local/etc/v2ray/config.json
          echo "v2ray config written (listening on 127.0.0.1:${PORT}, cloudflared forwards to it)"

      - name: Start v2ray
        if: env.V2RAY_DOMAIN != '' && env.V2RAY_UUID != ''
        continue-on-error: true
        run: |
          cat > "$HOME/run-v2ray.sh" <<'SH'
          #!/usr/bin/env bash
          while true; do
            /usr/local/bin/v2ray run -config /usr/local/etc/v2ray/config.json >> "$HOME/v2ray.log" 2>&1
            echo "[$(date -u +%FT%TZ)] v2ray exited ($?) - restart in 10s" >> "$HOME/v2ray.log"
            sleep 10
          done
          SH
          chmod +x "$HOME/run-v2ray.sh"
          setsid nohup "$HOME/run-v2ray.sh" >/dev/null 2>&1 &
          echo $! > "$HOME/v2ray.pid"
          for i in $(seq 1 20); do
            if ss -ltn | grep -q ":${V2RAY_PORT} "; then
              echo "v2ray is listening on port ${V2RAY_PORT}"
              break
            fi
            sleep 1
          done
          tail -20 "$HOME/v2ray.log" || true

      # ---------------------------------------------------------------- Cloudflare Tunnel
      - name: Start Cloudflare Tunnel (v2ray public entry point)
        if: env.V2RAY_DOMAIN != '' && env.CF_TUNNEL_ID != '' && env.CF_ACCOUNT_ID != '' && env.CF_API_TOKEN != ''
        continue-on-error: true
        env:
          DOMAIN: ${{ env.V2RAY_DOMAIN }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TUNNEL_ID: ${{ secrets.CF_TUNNEL_ID }}
          WS_PATH: ${{ env.V2RAY_WS_PATH }}
          PORT: ${{ env.V2RAY_PORT }}
        run: |
          CF_TOKEN=$(printf '%s' "$CF_TOKEN" | tr -d '\r' | tr -d '"' | tr -d "'" | xargs)
          if [ -z "$CF_TOKEN" ] || [ -z "$ACCOUNT_ID" ] || [ -z "$TUNNEL_ID" ]; then
            echo "::warning title=Cloudflare::CF_API_TOKEN, CF_ACCOUNT_ID, or CF_TUNNEL_ID missing - tunnel skipped"
            exit 0
          fi

          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared

          TOKEN_BODY=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/token")
          TUNNEL_TOKEN=$(printf '%s' "$TOKEN_BODY" | jq -r '.result // empty')
          if [ -z "$TUNNEL_TOKEN" ] || [ "$TUNNEL_TOKEN" = "null" ]; then
            echo "::error title=Cloudflare::could not read tunnel token (needs Account -> Cloudflare Tunnel -> Edit)"
            exit 1
          fi
          printf '%s' "$TUNNEL_TOKEN" > "$HOME/.cloudflared-tunnel-token"
          chmod 600 "$HOME/.cloudflared-tunnel-token"

          INGRESS=$(cat <<EOJ
          {
            "config": {
              "ingress": [
                {"hostname": "$DOMAIN", "path": "$WS_PATH", "service": "http://localhost:$PORT"},
                {"service": "http_status:404"}
              ],
              "warp-routing": {"enabled": false}
            }
          }
          EOJ
          )
          CFG_BODY=$(curl -sS -X PUT -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/configurations" \
            -d "$INGRESS")
          if printf '%s' "$CFG_BODY" | jq -e '.success' >/dev/null 2>&1; then
            echo "tunnel ingress: $DOMAIN$WS_PATH -> http://localhost:$PORT"
          else
            echo "::warning title=Cloudflare::could not update tunnel ingress - set it manually in the dashboard"
          fi

          cat > "$HOME/run-cloudflared.sh" <<'SH'
          #!/usr/bin/env bash
          while true; do
            /usr/local/bin/cloudflared tunnel --no-autoupdate \
              run --token "$(cat "$HOME/.cloudflared-tunnel-token")" \
              >> "$HOME/cloudflared.log" 2>&1
            echo "[$(date -u +%FT%TZ)] cloudflared exited ($?) - restart in 10s" >> "$HOME/cloudflared.log"
            sleep 10
          done
          SH
          chmod +x "$HOME/run-cloudflared.sh"
          setsid nohup "$HOME/run-cloudflared.sh" >/dev/null 2>&1 &
          echo $! > "$HOME/cloudflared.pid"

          connected=0
          for i in $(seq 1 60); do
            if grep -q "Registered tunnel connection" "$HOME/cloudflared.log" 2>/dev/null; then
              connected=1
              break
            fi
            sleep 2
          done
          if [ "$connected" = 1 ]; then
            echo "cloudflared connected to Cloudflare Tunnel"
          else
            echo "::warning title=Cloudflare::cloudflared did not register within 120s"
          fi
          tail -20 "$HOME/cloudflared.log" || true

      - name: Publish v2ray connection info
        if: env.V2RAY_DOMAIN != '' && env.V2RAY_UUID != ''
        continue-on-error: true
        env:
          DOMAIN: ${{ env.V2RAY_DOMAIN }}
          UUID: ${{ secrets.V2RAY_UUID }}
          PORT: ${{ env.V2RAY_PORT }}
          WS_PATH: ${{ env.V2RAY_WS_PATH }}
        run: |
          CLIENT_PORT=443
          CLIENT_TLS=tls
          CLIENT_SNI="$DOMAIN"
          CLIENT_HOST="$DOMAIN"
          CLIENT_NOTE="ws over TLS on 443 via Cloudflare Tunnel (v2ray on 127.0.0.1:8080)"

          VMESS_JSON=$(cat <<EOJ
          {
            "v": "2",
            "ps": "$DOMAIN",
            "add": "$DOMAIN",
            "port": "$CLIENT_PORT",
            "id": "$UUID",
            "aid": "0",
            "scy": "auto",
            "net": "ws",
            "type": "none",
            "host": "$CLIENT_HOST",
            "path": "$WS_PATH",
            "tls": "$CLIENT_TLS",
            "sni": "$CLIENT_SNI",
            "alpn": ""
          }
          EOJ
          )
          VMESS_LINK="vmess://$(printf '%s' "$VMESS_JSON" | base64 -w0)"

          echo "================ v2ray connection info ================"
          echo "domain       : $DOMAIN"
          echo "port         : $CLIENT_PORT/tcp (via Cloudflare Tunnel)"
          echo "uuid         : $UUID"
          echo "ws path      : $WS_PATH"
          echo "network      : ws | security: tls"
          echo "======================================================"

          CONN_FILE="$RUNNER_TEMP/v2ray-connection.txt"
          {
            echo "v2ray connection info"
            echo "domain       : $DOMAIN"
            echo "port         : $CLIENT_PORT/tcp (via Cloudflare Tunnel)"
            echo "uuid         : $UUID"
            echo "ws path      : $WS_PATH"
            echo "network      : ws | security: tls"
            echo ""
            echo "vmess link:"
            echo "$VMESS_LINK"
          } > "$CONN_FILE"

          {
            echo "### v2ray (VMess + WebSocket) is up"
            echo ""
            echo "**Domain:** \`$DOMAIN\`"
            echo "**Port:** \`$CLIENT_PORT\` (Cloudflare Tunnel -> localhost:${PORT})"
            echo "**UUID:** \`$UUID\`"
            echo "**WebSocket Path:** \`$WS_PATH\`"
            echo "**Security:** tls"
            echo ""
            echo "> $CLIENT_NOTE"
            echo ""
            echo "#### VMess link"
            echo "\`$VMESS_LINK\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload v2ray connection info
        if: env.V2RAY_DOMAIN != '' && env.V2RAY_UUID != ''
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: v2ray-connection
          path: ${{ runner.temp }}/v2ray-connection.txt
          retention-days: 1
          if-no-files-found: warn

      # ---------------------------------------------------------------- SearXNG
      # Self-hosted metasearch that backs the Hermes web_search tool. Everything
      # lives under $SEARXNG_ROOT (source tree + venv + settings.yml) so a single
      # actions/cache entry carries the whole install between runs; a cache hit
      # skips the git clone and the pip install entirely.
      #
      # SearXNG's setup.py imports the package at build time (which pulls in the
      # full runtime deps), so we do NOT "pip install searxng". We install
      # requirements.txt into a venv and run the source tree directly with
      # `python -m searx.webapp`, which is the same entry point the package's
      # console script uses.
      #
      # Hermes reaches it at SEARXNG_URL=http://127.0.0.1:8888 and needs
      # format=json enabled in settings.yml (the upstream default is html-only).

      - name: Cache SearXNG
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.searxng
          key: searxng-${{ runner.os }}-py312-v1
          restore-keys: |
            searxng-${{ runner.os }}-py312-

      - name: Install SearXNG
        continue-on-error: true
        run: |
          ROOT="$SEARXNG_ROOT"
          mkdir -p "$ROOT"
          # Cache hit = venv that imports the deps AND a source tree with webapp.py.
          # A venv carried across a base-image python bump fails the import check
          # and is rebuilt here, so the cache self-heals instead of wedging.
          if [ -x "$ROOT/venv/bin/python" ] \
             && [ -f "$ROOT/src/searx/webapp.py" ] \
             && "$ROOT/venv/bin/python" -c "import flask, msgspec, lxml, yaml" 2>/dev/null; then
            echo "SearXNG restored from cache"
          else
            echo "SearXNG cache miss - installing"
            rm -rf "$ROOT/venv" "$ROOT/src"
            git clone --depth 1 -q "$SEARXNG_REPO" "$ROOT/src"
            # /usr/bin/python3 is the runner's system 3.12; SearXNG needs >= 3.10.
            # Absolute path so the Hermes-bundled 3.14 on $PATH is not picked up.
            /usr/bin/python3 -m venv "$ROOT/venv"
            "$ROOT/venv/bin/pip" install -U pip wheel
            "$ROOT/venv/bin/pip" install -r "$ROOT/src/requirements.txt"
          fi
          "$ROOT/venv/bin/python" -c "import flask, msgspec, lxml, yaml; print('SearXNG deps OK')"

      - name: Generate SearXNG settings
        continue-on-error: true
        run: |
          ROOT="$SEARXNG_ROOT"
          # Only when absent, so the cached secret_key stays stable across runs.
          if [ -f "$ROOT/settings.yml" ]; then
            echo "SearXNG settings restored from cache"
            exit 0
          fi
          SECRET=$(/usr/bin/python3 -c "import secrets; print(secrets.token_hex(32))")
          cat > "$ROOT/settings.yml" <<EOF
          # Minimal instance config, merged over searx/settings.yml defaults.
          use_default_settings: true

          general:
            instance_name: "Hermes SearXNG"

          search:
            # The Hermes searxng backend calls /search?format=json. Upstream
            # defaults to html-only, which returns 403 for the JSON API.
            formats:
              - html
              - json
            safe_search: 0
            autocomplete: ""
            default_lang: "auto"

          server:
            bind_address: "127.0.0.1"
            port: ${SEARXNG_PORT}
            secret_key: "$SECRET"
            limiter: false
            public_instance: false
            image_proxy: false
            method: "GET"

          outgoing:
            request_timeout: 6.0
            max_request_timeout: 10.0
            enable_http2: true

          engines:
            - name: google
              engine: google
              shortcut: gg
              disabled: false
              timeout: 10.0
            - name: bing
              engine: bing
              shortcut: b
              disabled: false
              timeout: 10.0
            - name: duckduckgo
              engine: duckduckgo
              shortcut: ddg
              disabled: false
              timeout: 10.0
          EOF
          echo "SearXNG settings written"

      - name: Start SearXNG
        continue-on-error: true
        run: |
          cat > "$HOME/run-searxng.sh" <<'SH'
          #!/usr/bin/env bash
          export SEARXNG_SETTINGS_PATH="$HOME/.searxng/settings.yml"
          cd "$HOME/.searxng/src" || exit 1
          while true; do
            "$HOME/.searxng/venv/bin/python" -m searx.webapp >> "$HOME/searxng.log" 2>&1
            echo "[$(date -u +%FT%TZ)] searxng exited ($?) - restart in 10s" >> "$HOME/searxng.log"
            sleep 10
          done
          SH
          chmod +x "$HOME/run-searxng.sh"
          setsid nohup "$HOME/run-searxng.sh" >/dev/null 2>&1 &
          echo $! > "$HOME/searxng.pid"

          ready=0
          for i in $(seq 1 60); do
            if curl -fsS "$SEARXNG_URL/search?q=ok&format=json" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" = 1 ]; then
            echo "SearXNG is serving JSON on ${SEARXNG_URL#http://}"
          else
            echo "::warning title=SearXNG::did not answer /search?format=json within 60s"
            tail -20 "$HOME/searxng.log" 2>/dev/null || true
          fi

      # ---------------------------------------------------------------- Restore
      - name: Restore state from backup
        id: restore
        continue-on-error: true
        run: |
          if [ -z "$HERMES_BACKUP_TOKEN" ]; then
            echo "HERMES_BACKUP_TOKEN not set - starting from scratch"
            exit 0
          fi
          work="$(mktemp -d)"
          if ! git clone --quiet --depth 1 \
              "https://x-access-token:***" "$work"; then
            echo "No readable backup repo - fresh start"
            rm -rf "$work"
            exit 0
          fi
          # Pick the newest zip across both machines (linux + windows write separate timestamped files)
          best_zip=""; best_stamp=""
          for f in "$work"/hermes-state-*.zip; do
            [ -f "$f" ] || continue
            stamp="${f##hermes-state-}"
            stamp="${stamp%.zip}"
            if [ -z "$best_stamp" ] || [ "$stamp" \> "$best_stamp" ]; then
              best_stamp="$stamp"
              best_zip="$f"
            fi
          done
          if [ -n "$best_zip" ]; then
            cp "$best_zip" "$HOME/hermes-restore.zip"
            echo "RESTORE_ZIP=$HOME/hermes-restore.zip" >> "$GITHUB_ENV"
            echo "restoring ${best_zip##*/} (stamp $best_stamp)"
          else
            echo "no backup zip found - starting from scratch"
          fi
          if compgen -G "$work/omniroute-state-*.zip" > /dev/null; then
            best_omni=""; best_ostamp=""
            for f in "$work"/omniroute-state-*.zip; do
              [ -f "$f" ] || continue
              ostamp="${f##omniroute-state-}"
              ostamp="${ostamp%.zip}"
              if [ -z "$best_ostamp" ] || [ "$ostamp" \> "$best_ostamp" ]; then
                best_ostamp="$ostamp"
                best_omni="$f"
              fi
            done
            if [ -n "$best_omni" ]; then
              unzip -oq "$best_omni" -d "$HOME"
              chmod 600 "$HOME/.omniroute/.env" 2>/dev/null || true
              echo "restoring ${best_omni##*/}"
            fi
          fi
          rm -rf "$work"

      - name: Cache Hermes runtime
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.hermes/tools
            ~/.hermes/cache/uv
            ~/.hermes/installs
          key: hermes-${{ runner.os }}-tools-v1
          restore-keys: |
            hermes-${{ runner.os }}-tools-

      - name: Set up Node.js for OmniRoute
        uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: "24"

      - name: Cache npm downloads
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ env.OMNIROUTE_VERSION }}
          restore-keys: |
            npm-${{ runner.os }}-node24-

      - name: Cache OmniRoute install
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/omniroute-app
          key: omniroute-${{ runner.os }}-node24-${{ env.OMNIROUTE_VERSION }}

      - name: Install OmniRoute
        continue-on-error: true
        run: |
          bin="$HOME/omniroute-app/node_modules/.bin/omniroute"
          if [ -x "$bin" ]; then
            echo "OmniRoute restored from cache"
          else
            npm install --prefix "$HOME/omniroute-app" --no-audit --no-fund \
              "omniroute@${OMNIROUTE_VERSION}"
          fi
          "$bin" --version || true

      - name: Set OmniRoute admin password
        continue-on-error: true
        env:
          OMNIROUTE_PASSWORD: ${{ secrets.OMNIROUTE_PASSWORD }}
        run: |
          bin="$HOME/omniroute-app/node_modules/.bin/omniroute-reset-password"
          if [ -z "$OMNIROUTE_PASSWORD" ]; then
            echo "OMNIROUTE_PASSWORD not set - keeping restored password"
            exit 0
          fi
          if [ ! -x "$bin" ]; then
            echo "::warning title=OmniRoute::reset-password binary not found"
            exit 0
          fi
          export DATA_DIR="$HOME/.omniroute"
          if printf '%s' "$OMNIROUTE_PASSWORD" | "$bin" --password-stdin; then
            echo "OmniRoute admin password applied"
          else
            echo "::warning title=OmniRoute::password reset failed (no database yet?)"
          fi

      - name: Patch OmniRoute for model footer
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const file = path.join(process.env.HOME, "omniroute-app/node_modules/omniroute/open-sse/handlers/chatCore/nonStreamingResponse.ts");
           if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              const target = "if (echoModel) echoModelInObject(translatedResponse, echoModel);";
              const addition = "\n    if (responseModel && typeof translatedResponse === \"object\" && translatedResponse !== null) {\n      (translatedResponse as Record<string, unknown>).served_model = responseModel;\n    }";
              if (!content.includes("served_model = responseModel")) {
                content = content.replace(target, target + addition);
                fs.writeFileSync(file, content);
                console.log("Patched nonStreamingResponse.ts (non-streaming footer)");
              } else {
                console.log("nonStreamingResponse.ts already patched");
              }
            }
            const chunksDir = path.join(process.env.HOME, "omniroute-app/node_modules/omniroute/dist/.build/next/server/chunks");
            if (fs.existsSync(chunksDir)) {
              const fb = ["try{let _fm=\"[model: \"+ex+\"]\",_fc={id:\"chatcmpl-omniroute-footer\",","object:\"chat.completion.chunk\",created:Math.floor(Date.now()/1e3),","model:ex,choices:[{index:0,delta:{content:\"\\\\n\\\\n\"+_fm},finish_reason:null}]},","_fo=\"data: \"+JSON.stringify(_fc)+\"\\\\n\\\\n\";","eE?.appendConvertedChunk?.(_fo),eB(e,tN.encode(_fo)),tO.push(_fc)}catch{}"].join("");
              const anchors = [
                ["}if(await tG(e,eQ),tC=!0,ez){tO.push({done:!0});let t=\\\"data: [DONE]\\\\\\\\n\\\\\\\\n\\\";eE?.appendConvertedChunk?.(t),eB(e,tN.encode(t))}","}if(await tG(e,eQ),tC=!0,ez){"+fb+"tO.push({done:!0});let t=\\\"data: [DONE]\\\\\\\\n\\\\\\\\n\\\";eE?.appendConvertedChunk?.(t),eB(e,tN.encode(t))}"],
                ["}if(await tB(e,eK),tC=!0,eV){tO.push({done:!0});let t=\\\"data: [DONE]\\\\\\\\n\\\\\\\\n\\\";eE?.appendConvertedChunk?.(t),eB(e,tN.encode(t))}","}if(await tB(e,eK),tC=!0,eV){"+fb+"tO.push({done:!0});let t=\\\"data: [DONE]\\\\\\\\n\\\\\\\\n\\\";eE?.appendConvertedChunk?.(t),eB(e,tN.encode(t))}"]
              ];
              let count=0;
              for (const fname of fs.readdirSync(chunksDir)) {
                const fpath=path.join(chunksDir,fname);
                try { if (!fs.statSync(fpath).isFile()) continue; let d=fs.readFileSync(fpath,"utf8"); if (d.includes("chatcmpl-omniroute-footer")) continue; let patched=false; for (const [o,n] of anchors) { if (d.includes(o)) { d=d.replace(o,n); patched=true; break; } } if (patched) { fs.writeFileSync(fpath,d); count++; console.log("Patched chunk:",fname); } } catch{} }
              console.log("Patched "+count+" streaming chunks");
            }
          '

      - name: Start OmniRoute
        continue-on-error: true
        run: |
          mkdir -p "$HOME/.omniroute" "$HOME/omniroute-logs"
          export DATA_DIR="$HOME/.omniroute"
          export PORT="$OMNIROUTE_PORT"
          export OMNIROUTE_SERVER_HOST="0.0.0.0"
          export REQUIRE_API_KEY=true
          export OMNIROUTE_NO_UPDATE_NOTIFIER=1
          export OMNIROUTE_MEMORY_MB=4096
          export OMNIROUTE_READY_TIMEOUT_MS=120000
          export OMNIROUTE_RESTART_DELAY=10
          cat > "$HOME/run-omniroute.sh" <<'SH'
          #!/usr/bin/env bash
          BIN="$HOME/omniroute-app/node_modules/.bin/omniroute"
          while true; do
            "$BIN" serve --no-open >> "$HOME/omniroute-logs/omniroute.log" 2>&1
            echo "[$(date -u +%FT%TZ)] omniroute exited ($?) - restart in ${OMNIROUTE_RESTART_DELAY}s" >> "$HOME/omniroute-logs/omniroute.log"
            sleep "${OMNIROUTE_RESTART_DELAY:-10}"
          done
          SH
          chmod +x "$HOME/run-omniroute.sh"
          setsid nohup "$HOME/run-omniroute.sh" >/dev/null 2>&1 &
          echo $! > "$HOME/omniroute.pid"
          healthy=0
          for i in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:${OMNIROUTE_PORT}/api/monitoring/health" >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" = 1 ]; then
            echo "OmniRoute is healthy"
          else
            echo "::warning title=OmniRoute::not healthy after 180s"
          fi

      # ---------------------------------------------------------------- Freebuff
      - name: Cache Freebuff
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.npm
            ~/.config/manicode
            ~/.config/freebuff
          key: freebuff-${{ runner.os }}-v1
          restore-keys: |
            freebuff-${{ runner.os }}-v1-

      - name: Install Freebuff
        continue-on-error: true
        run: |
          sudo npm install -g freebuff
          freebuff --version

      - name: Configure Freebuff BYOK (OmniRoute)
        continue-on-error: true
        run: |
          mkdir -p "$HOME/.config/freebuff/byok" "$HOME/.config/manicode"

          cat > "$HOME/.config/freebuff/byok/connections.json" <<EOF
          [
            {
              "id": "a1c7f3e2-9b4d-4e8a-b6f1-2d5c8e0a3b47",
              "revision": 1,
              "name": "omniroute-local",
              "provider": "openai-compatible",
              "model": "MyCombo",
              "baseUrl": "http://127.0.0.1:${OMNIROUTE_PORT}/v1",
              "contextWindow": 128000,
              "maxOutputTokens": 32000,
              "credentialRef": "env:OMNIROUTE_API_KEY",
              "createdAt": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
              "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            }
          ]
          EOF

          cat > "$HOME/.config/manicode/settings.json" <<EOF
          {
            "mode": "DEFAULT",
            "adsEnabled": true,
            "byokConnection": {
              "id": "a1c7f3e2-9b4d-4e8a-b6f1-2d5c8e0a3b47",
              "revision": 1,
              "provider": "openai-compatible",
              "model": "MyCombo"
            }
          }
          EOF

          # Make the key available for freebuff runs in this and future sessions
          echo "OMNIROUTE_API_KEY=$OMNIROUTE_API_KEY" >> "$HOME/.bashrc"
          echo "OMNIROUTE_API_KEY=$OMNIROUTE_API_KEY" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- Hermes
      - name: Verify OmniRoute is responding
        run: |
          echo "Verifying OmniRoute endpoint at http://127.0.0.1:${OMNIROUTE_PORT}/v1 ..."
          healthy=0
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${OMNIROUTE_PORT}/api/monitoring/health" >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" != 1 ]; then
            echo "::error::OmniRoute is not responding at http://127.0.0.1:${OMNIROUTE_PORT}/v1 after 60s"
            exit 1
          fi
          echo "OmniRoute is responding"

      - name: Install Hermes Agent
        continue-on-error: true
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh \
            | bash -s -- --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/hermes --version

      - name: Import previous Hermes state
        if: env.RESTORE_ZIP != ''
        continue-on-error: true
        run: |
          ~/.local/bin/hermes import "$RESTORE_ZIP" --force
          rm -f "$RESTORE_ZIP"

      - name: Configure Hermes
        run: |
          mkdir -p "$HOME/.hermes"
          touch "$HOME/.hermes/.env"

          upsert() {
            if grep -q "^$1=" "$HOME/.hermes/.env"; then
              sed -i "s|^$1=.*|$1=$2|" "$HOME/.hermes/.env"
            else
              printf '%s=%s\n' "$1" "$2" >> "$HOME/.hermes/.env"
            fi
          }

          # Always use OmniRoute (OpenAI-compatible / custom provider) with MyCombo model.
          # No NVIDIA fallback — OmniRoute is the only provider from here on.
          upsert OMNIROUTE_BASE_URL   "http://127.0.0.1:${OMNIROUTE_PORT}/v1"
          upsert OMNIROUTE_API_KEY    "$OMNIROUTE_API_KEY"

          ~/.local/bin/hermes config set model.provider custom
          ~/.local/bin/hermes config set model.base_url "http://127.0.0.1:${OMNIROUTE_PORT}/v1"
          ~/.local/bin/hermes config set model.api_key "$OMNIROUTE_API_KEY"
          ~/.local/bin/hermes config set model.default "MyCombo"

          # ---- SearXNG as the web_search backend -------------------------------
          # The endpoint is not a secret, but SEARXNG_URL is read from the env
          # layer, so it belongs in .env alongside the other provider endpoints.
          upsert SEARXNG_URL "$SEARXNG_URL"
          ~/.local/bin/hermes config set web.backend searxng

          # The web toolset must be *allowed* in two places or the tool is
          # filtered out of the agent even though the backend is healthy:
          #   1. platform_toolsets.cli is an allowlist (setup wizard writes it)
          #   2. agent.disabled_toolsets is a denylist
          # Both edits are idempotent and preserve the user's other choices.
          cfg_get() { ~/.local/bin/hermes config get "$1" 2>/dev/null; }

          if ! cfg_get platform_toolsets.cli | grep -qx ' *- *web'; then
            cur=$(cfg_get platform_toolsets.cli | sed -n 's/^ *- *//p' | paste -sd, -)
            ~/.local/bin/hermes config set platform_toolsets.cli "[${cur:+$cur,}web]"
          fi

          if cfg_get agent.disabled_toolsets | sed -n 's/^ *- *//p' | grep -qx web; then
            rest=$(cfg_get agent.disabled_toolsets | sed -n 's/^ *- *//p' | grep -vx web | paste -sd, -)
            if [ -n "$rest" ]; then
              ~/.local/bin/hermes config set agent.disabled_toolsets \
                "[$(printf '%s' "$rest" | sed 's/,/","/g' | sed 's/^/"/;s/$/"/')]"
            else
              ~/.local/bin/hermes config set agent.disabled_toolsets '[]'
            fi
          fi

          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            upsert TELEGRAM_BOT_TOKEN     "$TELEGRAM_BOT_TOKEN"
            upsert TELEGRAM_ALLOWED_USERS "$TELEGRAM_USER_ID"
          fi
          chmod 600 "$HOME/.hermes/.env"
          ~/.local/bin/hermes config check || true

      - name: Start Hermes gateway
        continue-on-error: true
        run: |
          cat > "$HOME/run-hermes-gateway.sh" <<'SH'
          #!/usr/bin/env bash
          while true; do
            "$HOME/.local/bin/hermes" gateway run --replace >> "$HOME/.hermes/logs/gateway.log" 2>&1
            echo "[$(date -u +%FT%TZ)] gateway exited ($?) - restart in ${HERMES_RESTART_DELAY}s" >> "$HOME/.hermes/logs/gateway.log"
            sleep "$HERMES_RESTART_DELAY"
          done
          SH
          chmod +x "$HOME/run-hermes-gateway.sh"
          mkdir -p "$HOME/.hermes/logs"
          setsid nohup "$HOME/run-hermes-gateway.sh" >/dev/null 2>&1 &
          echo $! > "$HOME/hermes-gateway.pid"
          for i in $(seq 1 60); do
            grep -q . "$HOME/.hermes/logs/gateway.log" 2>/dev/null && break
            sleep 1
          done

      - name: Verify Hermes web_search (SearXNG)
        continue-on-error: true
        run: |
          echo "web_search backend:"
          ~/.local/bin/hermes doctor 2>&1 | grep -iE "web (search|extract)" || true
          code=$(curl -sS -o /tmp/sx.json -w '%{http_code}' \
            "$SEARXNG_URL/search?q=searxng&format=json" || echo 000)
          count=$(jq -r '.results | length' /tmp/sx.json 2>/dev/null || echo 0)
          if [ "$code" = "200" ] && [ "${count:-0}" -gt 0 ]; then
            echo "web_search OK - SearXNG returned ${count} results"
          else
            echo "::warning title=SearXNG::JSON search returned HTTP $code with ${count} results"
          fi

      - name: Publish address
        continue-on-error: true
        run: |
          {
            echo "### VPN node is up"
            echo ""
            echo "Tailnet address: \`$NODE_IP\`"
            echo "MagicDNS name:  \`$NODE_NAME\`"
            echo "Exit node: enabled with \`$EXIT_TAG\`"
            echo "SSH: \`tailscale ssh runner@$NODE_NAME\`"
            echo ""
            echo "OmniRoute dashboard: http://$NODE_IP:$OMNIROUTE_PORT  _(tailnet only)_"
            echo "SearXNG (Hermes web_search backend): http://$NODE_IP:$SEARXNG_PORT  _(tailnet only)_"
            echo "> v2ray is reachable via Cloudflare Tunnel at $V2RAY_DOMAIN:443"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- Telegram download bot: local Bot API server (req.9 step 1/3) ----
      # The public Bot API caps bot uploads at 50 MB; the LOCAL server lifts that
      # to 2000 MB and accepts an absolute file path in the file field, so the
      # bot hands a 500 MB video to the API without a second copy on disk.
      # Bind is 127.0.0.1:8081 only (network=host) - never published.
      - name: Start local Telegram Bot API server
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '147006' }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || '' }}
          # the downloader bot, NOT the Hermes gateway bot that the job-level
          # TELEGRAM_BOT_TOKEN belongs to
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_DL_BOT_TOKEN }}
        run: |
          set -uo pipefail
          BOTROOT=/home/runner/dlbot
          mkdir -p "$BOTROOT"/{files,tmp,logs}
          if [ -z "${TELEGRAM_API_HASH:-}" ]; then
            echo "::warning title=dlbot::TELEGRAM_API_HASH secret is not set - local Bot API server skipped"
            exit 0
          fi
          if docker info >/dev/null 2>&1; then
            docker rm -f dlbot-tgbotapi >/dev/null 2>&1 || true
            docker run -d --name dlbot-tgbotapi --network host \
              -v /home/runner/dlbot:/home/runner/dlbot \
              -e TELEGRAM_API_ID="$TELEGRAM_API_ID" \
              -e TELEGRAM_API_HASH="$TELEGRAM_API_HASH" \
              -e TELEGRAM_LOCAL=1 \
              -e TELEGRAM_HTTP_PORT=8081 \
              aiogram/telegram-bot-api:latest >/dev/null
            echo "telegram-bot-api container started"
          else
            BIN=/home/runner/.hermes/tools/telegram-bot-api/bin/telegram-bot-api
            if [ ! -x "$BIN" ]; then
              command -v cmake >/dev/null 2>&1 || \
                sudo apt-get install -y --no-install-recommends cmake g++ make zlib1g-dev libssl-dev 2>/dev/null || true
              git clone --depth 1 -q https://github.com/tdlib/telegram-bot-api.git /home/runner/telegram-bot-api
              cmake -S /home/runner/telegram-bot-api -B /home/runner/telegram-bot-api/build \
                    -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/home/runner/.hermes/tools/telegram-bot-api >/dev/null
              cmake --build /home/runner/telegram-bot-api/build --target install -j"$(nproc)" >/dev/null
            fi
            pkill -f 'telegram-bot-api' || true
            nohup "$BIN" --api-id="$TELEGRAM_API_ID" --api-hash="$TELEGRAM_API_HASH" --local \
              --http-address=127.0.0.1 --http-port=8081 \
              --dir="$BOTROOT/tgbotapi" --temp-dir="$BOTROOT/tmp" \
              --log="$BOTROOT/logs/botapi.log" >>"$BOTROOT/logs/botapi.stdout" 2>&1 &
            echo $! > "$BOTROOT/botapi.pid"
            echo "telegram-bot-api built from source and started"
          fi
          for i in $(seq 1 20); do
            curl -fsS --max-time 3 -o /dev/null \
              "http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/getMe" && break || sleep 3
          done
          curl -fsS --max-time 5 "http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/getMe" \
            | jq -c '{ok, username: .result.username, id: .result.id}' \
            || echo "::warning title=dlbot::bot API server not answering on 127.0.0.1:8081"

      # ---- Telegram download bot (req.9 step 2/3) ----
      # Long polling: the bot needs no inbound connectivity, so tailscale and the
      # Cloudflare tunnel are untouched. Code is pulled from this repo (the job
      # has no checkout step) and copied to $BOTROOT.
      - name: Start Telegram download bot
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_DL_BOT_TOKEN }}
          TELEGRAM_BOT_API_ROOT: http://127.0.0.1:8081
          DLBOT_ADMIN_ID: "180329538"
        run: |
          set -uo pipefail
          BOTROOT=/home/runner/dlbot
          mkdir -p "$BOTROOT"/{files,tmp,logs}
          [ -w "$BOTROOT/tmp" ] || sudo chown -R "$(id -un):$(id -gn)" "$BOTROOT" || true
          if [ ! -x /home/runner/.local/bin/yt-dlp ] && ! command -v yt-dlp >/dev/null 2>&1; then
            python3 -m pip install --user -q -U yt-dlp 2>/dev/null \
              || pip3 install --user -q --break-system-packages -U yt-dlp 2>/dev/null \
              || echo "::warning title=dlbot::yt-dlp install failed"
          fi
          rm -rf "$BOTROOT/src"
          if ! git clone --depth 1 -q \
              "https://x-access-token:${HERMES_BACKUP_TOKEN}@github.com/heydarsaki-dev/Personal.git" \
              "$BOTROOT/src" 2>/dev/null; then
            echo "::warning title=dlbot::could not clone bot code"
          fi
          if [ -d "$BOTROOT/src/dlbot" ]; then
            cp -f "$BOTROOT/src/dlbot/"*.py "$BOTROOT/"
            echo "bot code installed: $(ls "$BOTROOT"/*.py | wc -l) modules"
          fi
          if [ ! -f "$BOTROOT/bot.py" ]; then
            echo "::warning title=dlbot::bot.py missing - nothing to start"
            exit 0
          fi
          pkill -f "$BOTROOT/bot.py" || true
          sleep 1
          cd "$BOTROOT"
          nohup python3 -u "$BOTROOT/bot.py" >>"$BOTROOT/logs/bot.log" 2>&1 &
          echo $! > "$BOTROOT/bot.pid"
          sleep 8
          if kill -0 "$(cat "$BOTROOT/bot.pid")" 2>/dev/null; then
            echo "bot alive pid $(cat "$BOTROOT/bot.pid")"
          else
            echo "::warning title=dlbot::bot exited during startup"
          fi
          tail -n 20 "$BOTROOT/logs/bot.log" 2>/dev/null || true

      - name: Keep alive
        continue-on-error: true
        run: |
          # Anchor the loop to the JOB START, not to this step: SECONDS resets
          # to 0 here, so the old formula ignored the setup time and the job
          # could run past timeout-minutes and be cancelled (a cancelled job
          # saves no cache). WAIT = min(requested runtime, remaining budget),
          # so the workflow always ends with time left for the stop/backup
          # steps and therefore finishes successfully.
          NOW=$(date +%s)
          ELAPSED=$((NOW - JOB_START_EPOCH))
          BUDGET=$((JOB_TIMEOUT_MINUTES * 60))
          REMAIN=$((BUDGET - ELAPSED))
          REQUESTED=$((RUN_MINUTES * 60 - 300))
          if [ "$REQUESTED" -lt "$REMAIN" ]; then WAIT=$REQUESTED; else WAIT=$REMAIN; fi
          if [ "$WAIT" -lt 60 ]; then
            echo "::warning title=Timing::only ${REMAIN}s of job budget left - skipping keep-alive"
            exit 0
          fi
          echo "keeping alive for $((WAIT / 60)) min (elapsed $((ELAPSED / 60)) min, budget ${JOB_TIMEOUT_MINUTES} min)"
          END=$((SECONDS + WAIT))
          while [ $SECONDS -lt $END ]; do
            tailscale status >/dev/null 2>&1 || echo "tailscaled hiccup"
            omni=$(curl -fsS "http://127.0.0.1:${OMNIROUTE_PORT}/api/monitoring/health" >/dev/null 2>&1 && echo ok || echo down)
            sx=$(curl -fsS "$SEARXNG_URL/search?q=ping&format=json" >/dev/null 2>&1 && echo ok || echo down)
            cf=$(grep -c "Registered tunnel connection" "$HOME/cloudflared.log" 2>/dev/null || true)
            cf=${cf:-0}
            echo "[$(date -u +%H:%M:%S)] up as $NODE_IP | omniroute $omni | searxng $sx | cloudflared conns=$cf"
            sleep 60
          done

      - name: Stop Hermes gateway
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$HOME/.hermes/logs"
          ~/.local/bin/hermes gateway stop --yes --all >> "$HOME/.hermes/logs/gateway.log" 2>&1 || true
          if [ -f "$HOME/hermes-gateway.pid" ]; then
            kill -- -"$(cat "$HOME/hermes-gateway.pid")" 2>/dev/null || true
            kill "$(cat "$HOME/hermes-gateway.pid")" 2>/dev/null || true
          fi
          pkill -f 'run-hermes-gateway.sh' 2>/dev/null || true
          pkill -f 'hermes gateway run' 2>/dev/null || true

      - name: Stop OmniRoute
        if: always()
        continue-on-error: true
        run: |
          if [ -f "$HOME/omniroute.pid" ]; then
            kill -- -"$(cat "$HOME/omniroute.pid")" 2>/dev/null || true
            kill "$(cat "$HOME/omniroute.pid")" 2>/dev/null || true
          fi
          pkill -f 'run-omniroute.sh' 2>/dev/null || true
          pkill -f 'omniroute.*serve' 2>/dev/null || true

      - name: Stop cloudflared
        if: always()
        continue-on-error: true
        run: |
          if [ -f "$HOME/cloudflared.pid" ]; then
            kill -- -"$(cat "$HOME/cloudflared.pid")" 2>/dev/null || true
            kill "$(cat "$HOME/cloudflared.pid")" 2>/dev/null || true
          fi
          pkill -f 'run-cloudflared.sh' 2>/dev/null || true
          pkill -f 'cloudflared tunnel' 2>/dev/null || true

      - name: Stop SearXNG
        if: always()
        continue-on-error: true
        run: |
          if [ -f "$HOME/searxng.pid" ]; then
            kill -- -"$(cat "$HOME/searxng.pid")" 2>/dev/null || true
            kill "$(cat "$HOME/searxng.pid")" 2>/dev/null || true
          fi
          pkill -f 'run-searxng.sh' 2>/dev/null || true
          pkill -f 'searx.webapp' 2>/dev/null || true

      # ---- Telegram download bot: stop (req.9 step 3/3) ----
      - name: Stop Telegram download bot and Bot API server
        if: always()
        continue-on-error: true
        run: |
          set +e
          BOTROOT=/home/runner/dlbot
          [ -f "$BOTROOT/bot.pid" ]    && kill -TERM "$(cat "$BOTROOT/bot.pid")"
          [ -f "$BOTROOT/botapi.pid" ] && kill -TERM "$(cat "$BOTROOT/botapi.pid")"
          sleep 3
          pkill -f "$BOTROOT/bot.py" || true
          pkill -f 'telegram-bot-api' || true
          docker rm -f dlbot-tgbotapi >/dev/null 2>&1 || true
          rm -f "$BOTROOT/bot.pid" "$BOTROOT/botapi.pid"
          rm -rf "$BOTROOT/files" "$BOTROOT/tmp" "$BOTROOT/src"
          echo "bot + Bot API server stopped, temp files removed"

      - name: Back up state to GitHub
        if: always()
        continue-on-error: true
        run: |
          if [ -z "$HERMES_BACKUP_TOKEN" ]; then
            echo "HERMES_BACKUP_TOKEN not set - skipping backup"
            exit 0
          fi
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          out="$RUNNER_TEMP/state-out"
          rm -rf "$out"; mkdir -p "$out"
          ok=1
          if [ -x "$HOME/.local/bin/hermes" ]; then
            if ! ~/.local/bin/hermes backup -o "$out/hermes-state-${stamp}.zip"; then
              echo "::warning title=Backup::hermes backup failed"
              ok=0
            fi
          fi
          if [ -x "$HOME/omniroute-app/node_modules/.bin/omniroute" ] && [ -d "$HOME/.omniroute" ]; then
            if ! ( cd "$HOME" && zip -qr "$out/omniroute-state-${stamp}.zip" .omniroute -x '.omniroute/logs/*' ); then
              echo "::warning title=Backup::omniroute backup failed"
              ok=0
            fi
          fi
          if [ ! -f "$out/hermes-state-${stamp}.zip" ] && [ ! -f "$out/omniroute-state-${stamp}.zip" ]; then
            echo "no state captured - leaving existing backup untouched"
            exit 0
          fi
          if [ "$ok" != 1 ]; then
            echo "::warning title=Backup::snapshot failed - keeping previous backup"
            exit 0
          fi
          branch=$(curl -fsSL -H "Authorization: Bearer ${HERMES_BACKUP_TOKEN}" \
            "https://api.github.com/repos/${HERMES_BACKUP_REPO}" \
            | jq -r '.default_branch // empty')
          branch=${branch:-main}
          work="$RUNNER_TEMP/state-push"
          rm -rf "$work"
          push_ok=0
          for attempt in 1 2; do
            if git clone --quiet \
                "https://x-access-token:***" "$work" 2>/dev/null; then
              cd "$work"
              git fetch --quiet origin "$branch" 2>/dev/null || true
              git checkout -q "$branch" 2>/dev/null || git checkout -qb "$branch" 2>/dev/null || true
              cp "$out"/*.zip ./
              git add -f ./*.zip
              if git -c user.name=github-actions -c user.email=github-actions@github.com \
                  commit -q -m "state ${stamp}" 2>/dev/null; then
                if git push -q origin "$branch" 2>/dev/null; then
                  push_ok=1
                  echo "state (${stamp}) pushed to ${HERMES_BACKUP_REPO}"
                  break
                else
                  echo "push rejected (non-fast-forward); re-cloning and retrying (attempt $attempt)"
                  cd /
                  rm -rf "$work"
                fi
              else
                echo "no changes to commit"
                push_ok=1
                break
              fi
            else
              echo "clone failed (attempt $attempt)"
              sleep 2
            fi
          done
          if [ "$push_ok" != 1 ]; then
            echo "::warning title=Backup::push failed after retries - state not saved"
          fi

      - name: Prune superseded Hermes environments
        if: always()
        continue-on-error: true
        run: |
          root="$HOME/.hermes/installs"
          [ -d "$root" ] || exit 0
          python3 - "$root" <<'PY'
          import json, shutil, sys
          from pathlib import Path
          for facts in sorted(Path(sys.argv[1]).glob("*/facts.json")):
              try:
                  data = json.loads(facts.read_text(encoding="utf-8-sig"))
                  selected = Path(data["packages"]["venv"]["environment"]).resolve()
              except Exception:
                  continue
              if not selected.is_dir():
                  continue
              generation = selected.parent
              if generation.parent.name != "environments" or generation.parent.parent != facts.parent.resolve():
                  continue
              for sibling in sorted(generation.parent.iterdir()):
                  if sibling.is_dir() and sibling.resolve() != generation:
                      shutil.rmtree(sibling, ignore_errors=True)
          PY

      - name: Leave tailnet
        if: always()
        continue-on-error: true
        run: sudo tailscale logout || true
