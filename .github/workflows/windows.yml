name: Windows Server

on:
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "Minutes to keep the node alive (max 350)"
        required: false
        default: "350"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: Windows
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  Windows:
    runs-on: windows-2022
    timeout-minutes: 355
    env:
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      TS_TAILNET: ${{ secrets.TS_TAILNET || '-' }}
      TS_CLIENT_ID: ${{ secrets.TS_CLIENT_ID }}
      TS_CLIENT_SECRET: ${{ secrets.TS_CLIENT_SECRET }}
      RUN_MINUTES: ${{ inputs.run_minutes || '350' }}
      NODE_NAME: gh-win-vpn
      EXIT_TAG: tag:gh-exit
      HERMES_BACKUP_TOKEN: ${{ secrets.HERMES_BACKUP_TOKEN }}
      HERMES_BACKUP_REPO: heydarsaki-dev/HermesBackup
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
      DLBOT_ROOT: $env:USERPROFILE\dlbot
      HERMES_HOME: $env:USERPROFILE\.hermes
    steps:
      # ---------------------------------------------------------------- Record job start
      - name: Record job start
        shell: pwsh
        run: |
          "JOB_START_EPOCH=$(Get-Date -UFormat %s)" >> $env:GITHUB_ENV
          Write-Host "Job started at $(Get-Date -Format o) UTC"

      # ---------------------------------------------------------------- Tailscale
      - name: Delete old tailnet nodes
        shell: pwsh
        continue-on-error: true
        run: |
          $tokenResponse = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/oauth/token" -Method Post -Body @{ client_id = $env:TS_CLIENT_ID; client_secret = $env:TS_CLIENT_SECRET; grant_type = "client_credentials" }
          $headers = @{ Authorization = "Bearer $($tokenResponse.access_token)" }
          $devices = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/tailnet/$env:TS_TAILNET/devices" -Headers $headers
          $stale = $devices.devices | Where-Object { $_.hostname -eq $env:NODE_NAME }
          foreach ($d in $stale) { Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/tailnet/$env:TS_TAILNET/devices/$($d.id)" -Method Delete -Headers $headers; Write-Host "removed $($d.id)" }

      - name: Install Tailscale
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.104.7-amd64.msi" -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\tailscale.msi`"", "/quiet", "/norestart" -Wait

      - name: Join tailnet as exit node
        shell: pwsh
        continue-on-error: true
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          for ($i = 1; $i -le 30; $i++) { if (& $ts status 2>$null) { break }; Start-Sleep -Seconds 1 }
          & $ts up --authkey=$env:TS_AUTHKEY --hostname=$env:NODE_NAME --advertise-exit-node --advertise-tags=$env:EXIT_TAG --accept-dns=false --ssh --timeout=60s
          Start-Sleep -Seconds 3
          $ip = & $ts ip -4
          "NODE_IP=$ip" >> $env:GITHUB_ENV

      - name: Get public IP
        shell: pwsh
        id: public-ip
        continue-on-error: true
        run: |
          try { $pub = Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10 } catch { $pub = "unknown" }
          "PUBLIC_IP=$pub" >> $env:GITHUB_ENV

      # ---------------------------------------------------------------- v2ray
      - name: Install v2ray
        shell: pwsh
        if: env.V2RAY_DOMAIN != '' && env.V2RAY_UUID != ''
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri "https://github.com/v2fly/v2ray-core/releases/latest/download/v2ray-windows-64.zip" -OutFile "$env:TEMP\v2ray.zip"
          Expand-Archive -Path "$env:TEMP\v2ray.zip" -DestinationPath "$env:USERPROFILE\v2ray" -Force

      - name: Generate v2ray config
        shell: pwsh
        if: env.V2RAY_DOMAIN != '' && env.V2RAY_UUID != ''
        continue-on-error: true
        run: |
          $uuid = $env:UUID.Trim().ToLower()
          if ($uuid -notmatch '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') { Write-Error "bad UUID"; exit 1 }
          $cfg = @{ inbounds = @( @{ port = [int]$env:PORT; listen = "127.0.0.1"; protocol = "vmess"; settings = @{ clients = @( @{ id = $uuid; alterId = 0 } ) }; streamSettings = @{ network = "ws"; wsSettings = @{ path = $env:WS_PATH; headers = @{ Host = $env:DOMAIN } } } } ); outbounds = @( @{ protocol = "freedom"; settings = @{} } ); dns = @{ servers = @( "https+local://1.1.1.1/dns-query", "8.8.8.8", "localhost" ) } } | ConvertTo-Json -Depth 10
          New-Item -ItemType Directory -Path "$env:USERPROFILE\v2ray" -Force | Out-Null
          Set-Content -Path "$env:USERPROFILE\v2ray\config.json" -Value $cfg
          & "$env:USERPROFILE\v2ray\v2ray.exe" test -config "$env:USERPROFILE\v2ray\config.json"

      - name: Start v2ray
        shell: pwsh
        if: env.V2RAY_DOMAIN != '' && env.V2RAY_UUID != ''
        continue-on-error: true
        run: |
          Start-Process "$env:USERPROFILE\v2ray\v2ray.exe" -ArgumentList "run -config `"$env:USERPROFILE\v2ray\config.json`"" -RedirectStandardOutput "$env:USERPROFILE\v2ray.log" -RedirectStandardError "$env:USERPROFILE\v2ray.log" -WindowStyle Hidden
          Start-Sleep -Seconds 5
          for ($i = 1; $i -le 20; $i++) { if (Test-NetConnection -ComputerName 127.0.0.1 -Port $env:V2RAY_PORT -InformationLevel Quiet) { break }; Start-Sleep -Seconds 1 }

      # ---------------------------------------------------------------- Cloudflare Tunnel
      - name: Start Cloudflare Tunnel
        shell: pwsh
        if: env.V2RAY_DOMAIN != '' && env.CF_TUNNEL_ID != '' && env.CF_ACCOUNT_ID != '' && env.CF_API_TOKEN != ''
        continue-on-error: true
        run: |
          $token = $env:CF_API_TOKEN.Trim().Trim('"').Trim("'")
          if ([string]::IsNullOrEmpty($token) -or [string]::IsNullOrEmpty($env:ACCOUNT_ID) -or [string]::IsNullOrEmpty($env:TUNNEL_ID)) { Write-Warning "tunnel skipped"; exit 0 }
          if (-not (Test-Path "$env:USERPROFILE\cloudflared.exe")) { Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "$env:USERPROFILE\cloudflared.exe" }
          $tokBody = Invoke-RestMethod -Uri "https://api.cloudflare.com/client/v4/accounts/$env:ACCOUNT_ID/cfd_tunnel/$env:TUNNEL_ID/token" -Headers @{ "Authorization" = "Bearer $token" }
          $tunnelTok = $tokBody.result
          Set-Content -Path "$env:USERPROFILE\.cloudflared-tunnel-token" -Value $tunnelTok
          $ing = @{ config = @{ ingress = @( @{ hostname = $env:DOMAIN; path = $env:WS_PATH; service = "http://localhost:$env:PORT" }, @{ service = "http_status:404" } ); warp-routing = @{ enabled = $false } } } | ConvertTo-Json -Depth 10
          Invoke-RestMethod -Uri "https://api.cloudflare.com/client/v4/accounts/$env:ACCOUNT_ID/cfd_tunnel/$env:TUNNEL_ID/configurations" -Method PUT -Headers @{ "Authorization" = "Bearer $token"; "Content-Type" = "application/json" } -Body $ing | Out-Null
          Start-Process "$env:USERPROFILE\cloudflared.exe" -ArgumentList "tunnel", "run", "--token", $tunnelTok -RedirectStandardOutput "$env:USERPROFILE\cloudflared.log" -RedirectStandardError "$env:USERPROFILE\cloudflared.log" -WindowStyle Hidden
          $conn = $false
          for ($i = 1; $i -le 60; $i++) { if (Select-String -Path "$env:USERPROFILE\cloudflared.log" -Pattern "Registered tunnel connection" -Quiet) { $conn = $true; break }; Start-Sleep -Seconds 2 }

      # ---------------------------------------------------------------- Restore Hermes state
      - name: Restore state from backup
        shell: pwsh
        id: restore
        continue-on-error: true
        run: |
          if ([string]::IsNullOrEmpty($env:HERMES_BACKUP_TOKEN)) { exit 0 }
          $work = [System.IO.Path]::GetTempFileName(); Remove-Item $work; New-Item -ItemType Directory -Path $work -Force | Out-Null
          git clone --quiet --depth 1 "https://x-access-token:***" $work 2>$null | Out-Null
          if (Test-Path "$work\hermes-state.zip") { Copy-Item "$work\hermes-state.zip" "$env:USERPROFILE\hermes-restore.zip"; "RESTORE_ZIP=$env:USERPROFILE\hermes-restore.zip" >> $env:GITHUB_ENV }
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue

      # ---------------------------------------------------------------- Hermes Desktop
      - name: Install Hermes Agent with Desktop
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri "https://hermes-agent.nousresearch.com/install.sh" -OutFile "$env:TEMP\hermes-install.sh"
          bash "$env:TEMP\hermes-install.sh" --non-interactive --skip-browser --skip-computer-use --include-desktop
          "$env:USERPROFILE\.local\bin" >> $env:GITHUB_PATH
          & "$env:USERPROFILE\.local\bin\hermes" --version

      - name: Import Hermes state
        shell: pwsh
        if: env.RESTORE_ZIP != ''
        continue-on-error: true
        run: |
          & "$env:USERPROFILE\.local\bin\hermes" import "$env:RESTORE_ZIP" --force

      - name: Configure Hermes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:HERMES_HOME" -Force | Out-Null
          & "$env:USERPROFILE\.local\bin\hermes" config set model.provider custom
          & "$env:USERPROFILE\.local\bin\hermes" config set model.default "MyCombo"
          if ($env:TELEGRAM_BOT_TOKEN) {
            & "$env:USERPROFILE\.local\bin\hermes" config set platforms.telegram.enabled true
            & "$env:USERPROFILE\.local\bin\hermes" config set platforms.telegram.home_channel.chat_id "$env:TELEGRAM_USER_ID"
            & "$env:USERPROFILE\.local\bin\hermes" config set platforms.telegram.home_channel.name "$env:TELEGRAM_USER_ID"
            & "$env:USERPROFILE\.local\bin\hermes" config set platforms.telegram.home_channel.user_id "$env:TELEGRAM_USER_ID"
          }

      - name: Start Hermes gateway (headless CLI)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Path "$env:USERPROFILE\.hermes\logs" -Force | Out-Null
          Start-Process "$env:USERPROFILE\.local\bin\hermes" -ArgumentList "gateway", "run", "--replace" -RedirectStandardOutput "$env:USERPROFILE\.hermes\logs\gateway.log" -RedirectStandardError "$env:USERPROFILE\.hermes\logs\gateway.err" -WindowStyle Hidden

      # ---------------------------------------------------------------- Telegram download bot
      - name: Start local Telegram Bot API server
        shell: pwsh
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '147006' }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_DL_BOT_TOKEN }}
        run: |
          $botRoot = "$env:DLBOT_ROOT"
          New-Item -ItemType Directory -Path "$botRoot\files", "$botRoot\tmp", "$botRoot\logs" -Force | Out-Null
          if ([string]::IsNullOrEmpty($env:TELEGRAM_API_HASH)) { Write-Warning "no API hash"; exit 0 }
          Start-Process "$env:USERPROFILE\.hermes\tools\telegram-bot-api\bin\telegram-bot-api.exe" -ArgumentList "--api-id=`"$env:TELEGRAM_API_ID`"", "--api-hash=`"$env:TELEGRAM_API_HASH`"", "--local", "--http-address=127.0.0.1", "--http-port=8081", "--dir=`"$botRoot\tgbotapi`"", "--temp-dir=`"$botRoot\tmp`"" -RedirectStandardOutput "$botRoot\logs\botapi.log" -WindowStyle Hidden
          for ($i = 1; $i -le 20; $i++) { try { Invoke-RestMethod -Uri "http://127.0.0.1:8081/bot$env:TELEGRAM_BOT_TOKEN/getMe" -TimeoutSec 3 -ErrorAction Stop; break } catch { Start-Sleep -Seconds 3 } }

      - name: Start Telegram download bot
        shell: pwsh
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_DL_BOT_TOKEN }}
          DLBOT_ADMIN_ID: "180329538"
        run: |
          $botRoot = "$env:DLBOT_ROOT"
          New-Item -ItemType Directory -Path "$botRoot\files", "$botRoot\tmp", "$botRoot\logs" -Force | Out-Null
          if (-not (Get-Command yt-dlp -ErrorAction SilentlyContinue)) { python3 -m pip install --user -q -U yt-dlp 2>$null | Out-Null }
          Remove-Item -Recurse -Force "$botRoot\src" -ErrorAction SilentlyContinue
          git clone --depth 1 -q "https://x-access-token:***" "$botRoot\src" 2>$null | Out-Null
          if (Test-Path "$botRoot\src\dlbot") { Copy-Item "$botRoot\src\dlbot\*.py" -Destination "$botRoot\" -Force }
          if (-not (Test-Path "$botRoot\bot.py")) { Write-Warning "no bot.py"; exit 0 }
          Start-Process python3.exe -ArgumentList "-u", "$botRoot\bot.py" -RedirectStandardOutput "$botRoot\logs\bot.log" -RedirectStandardError "$botRoot\logs\bot.log" -WindowStyle Hidden
          Start-Sleep -Seconds 8

      # ---------------------------------------------------------------- Keep alive
      - name: Keep alive
        shell: pwsh
        continue-on-error: true
        run: |
          $now = (Get-Date).ToUniversalTime(); $start = [datetime]::Parse($env:JOB_START_EPOCH)
          $elapsed = ($now - $start).TotalSeconds; $budget = [int]$env:JOB_TIMEOUT_MINUTES * 60
          $remain = $budget - $elapsed; $req = [int]$env:RUN_MINUTES * 60 - 300
          $wait = if ($req -lt $remain) { $req } else { $remain }
          if ($wait -lt 60) { exit 0 }
          $end = [datetime]::Now.AddSeconds($wait)
          while ([datetime]::Now -lt $end) { Start-Sleep -Seconds 60 }

      # ---------------------------------------------------------------- Stops (if: always())
      - name: Stop all
        shell: pwsh
        if: always()
        continue-on-error: true
        run: |
          Get-Process hermes -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process cloudflared -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process python -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -like "*bot.py*" } | Stop-Process -Force
          Get-Process telegram-bot-api -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item -Recurse -Force "$env:DLBOT_ROOT\files", "$env:DLBOT_ROOT\tmp", "$env:DLBOT_ROOT\src" -ErrorAction SilentlyContinue

      # ---------------------------------------------------------------- Back up state to GitHub
      - name: Back up state to GitHub
        shell: pwsh
        if: always()
        continue-on-error: true
        run: |
          if ([string]::IsNullOrEmpty($env:HERMES_BACKUP_TOKEN)) { exit 0 }
          $stamp = Get-Date -UFormat %Y%m%dT%H%M%SZ
          $out = Join-Path $env:RUNNER_TEMP "state-out"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & "$env:USERPROFILE\.local\bin\hermes" backup -o "$out\hermes-state.zip" 2>$null | Out-Null
          $work = Join-Path $env:RUNNER_TEMP "state-push"
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          git clone --quiet "https://x-access-token:***" $work 2>$null | Out-Null
          Copy-Item "$out\*.zip" $work -Force
          Set-Location $work
          git add -f ./*.zip
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -q -m "state $stamp" || true
          git branch -M main
          git push -q --force origin main

      - name: Leave tailnet
        shell: pwsh
        if: always()
        continue-on-error: true
        run: tailscale logout || true
